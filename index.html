<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar serviço</title>
    <link rel="stylesheet" href="sty.css">
</head>
<body>
    <main class="tela">
        <form class="card">
            <h1 class="cabecalho">Agendar serviço</h1>

            <div class="opcoes" role="radiogroup" aria-label="Selecione um serviço">
                <label class="opcao">
                    <span>Corte de cabelo</span>
                    <input type="radio" name="servico" value="corte">
                </label>
                <label class="opcao">
                    <span>Manutenção</span>
                    <input type="radio" name="servico" value="manutencao">
                </label>
                <label class="opcao">
                    <span>Consultoria</span>
                    <input type="radio" name="servico" value="consultoria">
                </label>
            </div>

            <button class="btn-continuar" type="button">Continuar</button>
        </form>
    </main>
</body>
</html>
